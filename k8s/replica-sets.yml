apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: node-app-replica-set
  namespace: webapps
  labels:
    app: guestbook
    tier: node-label
spec:
  # modify replicas according to your case
  replicas: 6
  selector:
    matchLabels:
      tier: node-label
  template:
    metadata:
      namespace: webapps
      labels:
        tier: node-label
    spec:
      containers:
      - name: node-container-rep
        image: shadabsk/node-todo-cicd:latest
